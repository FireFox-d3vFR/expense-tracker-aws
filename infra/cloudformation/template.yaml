AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Expense Tracker - Serverless backend MVP (Cognito + API Gateway + Lambda + DynamoDB + S3)

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Deployment environment (dev or prod)

Globals:
  Function:
    Runtime: dotnet10
    Architectures: [x86_64]
    MemorySize: 512
    Timeout: 30
    Environment:
      Variables:
        EXPENSE_REPORTS_TABLE: !Ref ExpenseReportsTable
        RECEIPTS_BUCKET: !Ref ReceiptsBucket

Resources:

  # ─── Cognito ───────────────────────────────────────────────────────────────

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub expense-tracker-${Environment}
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          Required: true
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub expense-tracker-maui-${Environment}
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  EmployeeGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Employee
      UserPoolId: !Ref UserPool
      Description: Standard employees who submit expense reports

  FinanceManagerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: FinanceManager
      UserPoolId: !Ref UserPool
      Description: Finance managers who review and approve expense reports

  # ─── DynamoDB ──────────────────────────────────────────────────────────────

  ExpenseReportsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub ExpenseReports-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ─── S3 ────────────────────────────────────────────────────────────────────

  ReceiptsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub expense-tracker-receipts-${Environment}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldReceipts
            Status: Enabled
            ExpirationInDays: 365

  # ─── IAM Role ──────────────────────────────────────────────────────────────

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub expense-tracker-lambda-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ExpenseTrackerLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DynamoDbAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt ExpenseReportsTable.Arn
                  - !Sub '${ExpenseReportsTable.Arn}/index/*'
              - Sid: S3ReceiptsAccess
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub '${ReceiptsBucket.Arn}/receipts/*'

  # ─── Lambda ────────────────────────────────────────────────────────────────

  ExpenseTrackerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub expense-tracker-api-${Environment}
      CodeUri: ../../src/backend/ExpenseTracker.Api/
      Handler: ExpenseTracker.Api::ExpenseTracker.Api.Api.LambdaEntryPoint::FunctionHandlerAsync
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        ApiProxy:
          Type: Api
          Properties:
            RestApiId: !Ref ExpenseTrackerApi
            Path: /{proxy+}
            Method: ANY

  # ─── API Gateway ───────────────────────────────────────────────────────────

  ExpenseTrackerApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub expense-tracker-api-${Environment}
      StageName: !Ref Environment
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn

# ─── Outputs ───────────────────────────────────────────────────────────────

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ExpenseTrackerApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-ApiUrl'

  UserPoolId:
    Description: Cognito User Pool ID (needed for seed-users.ps1)
    Value: !Ref UserPool
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolId'

  UserPoolClientId:
    Description: Cognito App Client ID (needed for MAUI config)
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolClientId'

  UserPoolDomain:
    Description: Cognito User Pool domain prefix
    Value: !Sub 'cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'

  ExpenseReportsTableName:
    Description: DynamoDB table name
    Value: !Ref ExpenseReportsTable
    Export:
      Name: !Sub '${AWS::StackName}-TableName'

  ReceiptsBucketName:
    Description: S3 receipts bucket name
    Value: !Ref ReceiptsBucket
    Export:
      Name: !Sub '${AWS::StackName}-ReceiptsBucket'

  LambdaFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt ExpenseTrackerFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaArn'
